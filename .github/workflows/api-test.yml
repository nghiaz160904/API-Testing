name: Laravel CI/CD with Newman Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    # Bước 1: Lấy code từ repository về
    - name: Checkout Code ⚙️
      uses: actions/checkout@v4

    # Bước 2: Tạo file .env từ template và secrets
    - name: Create Laravel .env file 🔧
      env:
        APP_KEY: ${{ secrets.APP_KEY }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: |
        echo "🔧 Creating Laravel .env file from .env.ci template..."
        # Lệnh envsubst sẽ đọc file .env.ci, tìm các biến $VAR và thay bằng giá trị từ secrets
        envsubst < sprint5-with-bugs/API/.env.ci > sprint5-with-bugs/API/.env
        echo "✅ .env file created successfully."

    # Bước 3: Khởi động các container Docker
    - name: Start Docker Containers 🐳
      run: docker compose up -d

    # Bước 4: Chờ các dịch vụ sẵn sàng
    - name: Wait for Services ⏳
      run: sleep 60
      shell: bash

    # Bước 5: Cài đặt các thư viện và thiết lập ứng dụng
    - name: Setup Application 🔧
      run: |
        echo "📦 Installing Composer dependencies..."
        # Sử dụng service 'composer' đã định nghĩa trong docker-compose.yml
        docker compose run --rm composer
        
        echo "🔒 Fixing permissions..."
        # Gán quyền truy cập cho thư mục storage và cache
        docker compose exec -T -u root laravel-api chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache
        
        echo "🗄️ Running database migrations and seeding..."
        # Chạy migrate & seed
        docker compose exec -T laravel-api php artisan migrate:fresh --seed --force

    # Bước 6: Cài đặt Node.js và Newman
    - name: Install Node.js & Newman ⚙️
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: npm install -g newman newman-reporter-htmlextra

    # Bước 7: Chạy kiểm thử Newman với multiple collections
    - name: Run Newman Tests 🚀
      run: |
        echo "🧪 Running Newman tests for multiple collections..."
        
        # Tạo thư mục reports nếu chưa tồn tại
        mkdir -p reports
        
        # Define collections to test
        collections=(
          "GET_Categories_Tree_API.postman_collection.json"
          "GET_Category_Details_API.postman_collection.json"
          "POST_Categories_API.postman_collection.json"
        )
        
        # Run tests for each collection
        overall_status=0
        for collection in "${collections[@]}"; do
          collection_name=$(basename "$collection" .postman_collection.json)
          report_file="reports/${collection_name}_report.html"
          log_file="reports/${collection_name}.log"
          
          echo -e "\n🧪 Testing Collection: $collection_name"
          
          newman run "./tests/api/$collection" \
            --environment "./tests/api/environment.json" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export "$report_file" \
            --reporter-htmlextra-title "$collection_name Test Report" 2>&1 | tee "$log_file"
          
          # Capture exit status
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ $collection_name tests failed"
            overall_status=1
          else
            echo "✅ $collection_name tests passed"
          fi
          
          # Generate summary
          echo "📊 Report: $report_file"
          echo "📋 Log: $log_file"
        done
        
        # Exit with overall status
        if [ $overall_status -ne 0 ]; then
          echo "❌ Some tests failed!"
          exit 1
        else
          echo "✅ All tests passed!"
          exit 0
        fi

    # Bước 8: Upload báo cáo (luôn chạy)
    - name: Upload Test Reports 📊
      uses: actions/upload-artifact@v4
      if: always()
      with:
      name: newman-test-reports
      path: reports/
      retention-days: 7

    # Bước 9: Dọn dẹp (luôn chạy)
    - name: Cleanup 🧹
      if: always()
      run: docker compose down -v

      